<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Día 2: Atrapa los Premios 🦴</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', sans-serif; }
    body {
      background: linear-gradient(180deg, #0f172a 0%, #1e3a8a 100%);
      color: #fff;
      height: 100vh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    header {
      margin-top: 20px;
      text-align: center;
      z-index: 10;
    }
    h1 { color: #60a5fa; font-size: 1.6rem; }
    .score-board { font-size: 1.2rem; margin-top: 5px; color: #93c5fd; }
    
    #gameArea {
      position: relative;
      width: 100%;
      max-width: 500px;
      flex: 1;
      margin: 20px 0;
      border-left: 2px dashed rgba(255,255,255,0.1);
      border-right: 2px dashed rgba(255,255,255,0.1);
      overflow: hidden;
    }
    #basket {
      position: absolute;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      user-select: none;
      cursor: pointer;
      width: 48px;
      height: 48px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    #lotsoBasket {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }
    .falling-item {
      position: absolute;
      top: -40px;
      font-size: 2rem;
      user-select: none;
    }

    .modal {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.85);
      backdrop-filter: blur(8px);
      justify-content: center;
      align-items: center;
      padding: 20px;
      z-index: 100;
    }
    .modal-content {
      background: #1e293b;
      border: 2px solid #60a5fa;
      border-radius: 20px;
      padding: 30px;
      max-width: 380px;
      text-align: center;
    }
  </style>
</head>
<body>

  <header>
    <h1>Premios para Coco con Lotso 🍓🧸</h1>
    <div class="score-board">Comida atrapada: <span id="score">0</span> / 5</div>
  </header>

  <div id="gameArea">
    <div id="basket">
      <img src="st,small,507x507-pad,600x600,f8f8f8.jpg" id="lotsoBasket" alt="Lotso">
    </div>
  </div>

  <div class="modal" id="winModal">
    <div class="modal-content">
      <h2 style="color: #60a5fa;">¡Misión Cumplida! 🍓</h2>
      <p style="margin: 15px 0; color: #cbd5e1;">Lotso juntó toda la comida de Coco por hoy.</p>
      <h1 style="color: #38bdf8; font-size: 2.3rem; margin: 10px 0;">¡Faltan 5 días para tu cumple!</h1>
      <div style="font-size: 1.3rem; font-weight: bold; color: #60a5fa; margin-top: 15px;">— V.L. —</div>
    </div>
  </div>

  <script>
    const gameArea = document.getElementById('gameArea');
    const basket = document.getElementById('basket');
    const scoreEl = document.getElementById('score');
    const modal = document.getElementById('winModal');
    
    let score = 0;
    let basketX = gameArea.clientWidth / 2;
    const items = ['🦴', '🥩', '🥓', '🍖'];

    gameArea.addEventListener('mousemove', (e) => {
      const rect = gameArea.getBoundingClientRect();
      basketX = e.clientX - rect.left;
      basket.style.left = basketX + 'px';
    });

    gameArea.addEventListener('touchmove', (e) => {
      const rect = gameArea.getBoundingClientRect();
      basketX = e.touches[0].clientX - rect.left;
      basket.style.left = basketX + 'px';
    });

    function spawnItem() {
      if (score >= 5) return;
      const item = document.createElement('div');
      item.className = 'falling-item';
      item.innerText = items[Math.floor(Math.random() * items.length)];
      item.style.left = Math.random() * (gameArea.clientWidth - 40) + 'px';
      gameArea.appendChild(item);

      let top = 0;
      const fallInterval = setInterval(() => {
        top += 4;
        item.style.top = top + 'px';

        const basketRect = basket.getBoundingClientRect();
        const itemRect = item.getBoundingClientRect();

        if (
          itemRect.bottom >= basketRect.top &&
          itemRect.top <= basketRect.bottom &&
          itemRect.right >= basketRect.left &&
          itemRect.left <= basketRect.right
        ) {
          clearInterval(fallInterval);
          item.remove();
          score++;
          scoreEl.innerText = score;

          if (score >= 5) {
            setTimeout(() => { modal.style.display = 'flex'; }, 300);
          }
        }

        if (top > gameArea.clientHeight) {
          clearInterval(fallInterval);
          item.remove();
        }
      }, 20);
    }

    setInterval(spawnItem, 1200);
  </script>
</body>
</html>
